# Orbital Drift layer configuration.
# Saved changes apply immediately while the app runs; the music never stops.
# Syntax: key = value   A bad line keeps the old value.
# Comments need their own line: a trailing "#" would clash with #rrggbb colours.

# Visual knobs
star.count   = 260
orbit.base   = 0.43
orbit.step   = 0.092
glow.scale   = 1.0
energy.gain  = 7.0


# Track names, roles and colours now live in campaigns/*.conf, because they
# describe the Bitwig project rather than the look of the app.
