# Orbital Drift layer configuration.
# Saved changes apply immediately while the app runs; the music never stops.
# Syntax: key = value   A bad line keeps the old value.
# Comments need their own line: a trailing "#" would clash with #rrggbb colours.

# Visual knobs
star.count   = 260
orbit.base   = 0.43
orbit.step   = 0.092
glow.scale   = 1.0
energy.gain  = 7.0

# How loud a track must be, as a fraction of its own recent peak, for its
# sigil to show. Lower is easier: the clue stays visible longer.
sigil.level  = 0.45

# Per-track role label and colour. Colours are hex, with or without a leading "#".
# These mirror the Bitwig track colours; once project.xml parsing lands they
# will come from the project itself and this file becomes an override.
track.1.role  = ATMOSPHERE
track.1.color = af95f6
track.2.role  = MELODY
track.2.color = 74deef
track.3.role  = TEXTURE
track.3.color = 93b4ce
track.4.role  = LOW END
track.4.color = 71d5b3
track.5.role  = PULSE
track.5.color = efbb77
track.6.role  = BACKBEAT
track.6.color = e38fa7
track.7.role  = MOVEMENT
track.7.color = d6d295
