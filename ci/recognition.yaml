# The image-recognition test for skit objects.
#
# Every skit has at least one object, and an object has to read as the thing it
# is meant to be. `od recognise` renders each one alone and asks a local vision
# model to describe it, then looks for any accepted word.
#
# This tests the drawing, not the model's vocabulary: "wagon" for a cart is a
# correct reading. It is also why several words are accepted per object.

model: llava:7b          # ollama pull llava:7b
fallback: moondream      # smaller and weaker; used only if the model above is missing
prompt: Describe this image in one short sentence.

# Vision models are not deterministic even at temperature zero, so an object
# gets a few chances and passes if any attempt reads correctly. Without this a
# green build turns red on a re-run with no change, which teaches everyone to
# ignore it.
attempts: 3

# How many objects must be recognised. This is a floor that should rise, not a
# target: it exists so a weak judge cannot quietly hold the art hostage, and so
# a genuine regression in a drawing still fails the build. Raise it whenever a
# better model lands or a drawing improves; never lower it to make a red build
# green.
minimum: 9
# 9 of 12 today, with moondream as the judge. The three it cannot read --
# haystack, signpost, well -- are drawings a person names at a glance; the
# model describes shapes ("a round top and pointed base surrounded by thin
# sticks") without ever naming the object. llava:7b is the intended judge and
# the floor should go back to 12 once it is in place. Do not widen the accepted
# words to close this gap: that tests vocabulary, not drawing.

objects:
  - name: market stall
    accept: [stall, market, shop, booth, kiosk, stand, awning, canopy, store, counter, display]
  - name: cart
    accept: [cart, wagon, carriage, trolley, wheelbarrow, barrow, wheel]
  - name: campfire
    accept: [fire, campfire, bonfire, flame, firewood, logs, wood, burning]
  - name: fountain
    accept: [fountain, well, pool, basin, water, pond]
  - name: bench
    accept: [bench, seat, chair, sofa, couch, furniture, table]
  - name: stage
    accept: [stage, platform, podium, screen, sign, billboard, board, table]
  - name: picnic blanket
    accept: [blanket, picnic, rug, mat, cloth, basket, towel, tablecloth]
  - name: haystack
    accept: [haystack, hay, straw, stack, cone, pile, sheaf]
  - name: signpost
    accept: [sign, signpost, post, pole, direction, arrow, marker, street]
  - name: boat
    accept: [boat, ship, sailboat, sail, vessel, canoe]
  - name: well
    accept: [well, fountain, basin, barrel, bucket, water, hut]
  - name: tent
    accept: [tent, teepee, tipi, camp, cone, pyramid]
