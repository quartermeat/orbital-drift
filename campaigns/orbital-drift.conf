# Orbital Drift: the first campaign.
# One Bitwig project becomes one scenario. A second project is a second file
# like this one, not a second build.
#
# Syntax: key = value. Comments need their own line, because a trailing "#"
# cannot be told apart from a #rrggbb colour.

title    = Orbital Drift
subtitle = Build a world out of sound.
key      = A MINOR
tempo    = 72
bars     = 16

# Where the stems live, relative to the assets directory.
stems    = audio

# Which end of the list opens first. The run starts sparse and rhythmic and
# ends on the harmonic bed.
unlock   = right-to-left

track.1.name  = Nebula Pad
track.1.file  = 01 Nebula Pad.wav
track.1.role  = ATMOSPHERE
track.1.color = af95f6

track.2.name  = Starlight Echoes
track.2.file  = 02 Starlight Echoes.wav
track.2.role  = MELODY
track.2.color = 74deef

